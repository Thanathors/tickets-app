<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tickets">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Slate-and-gold inventory look, shared with the BestProjectEver devlog. */
  :root {
    --bg: #eef1f4; --surface: #ffffff; --cell: #dfe5ec; --line: #c6cfda; --text: #1c2430; --muted: #5b6778;
    --accent: #b7791f; --accent-soft: #f6e7c8; --accent-ink: #1c1406;
    --teal: #2c7a7b; --teal-soft: #d5ecec; --red: #b83232;
    --hover: var(--cell);
    --task: var(--teal); --bug: var(--red); --epic: var(--accent); --ok: var(--teal); --warn: var(--accent);
    --display: "Pixelify Sans", "Courier New", monospace;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #12161c; --surface: #1a2029; --cell: #252d39; --line: #323c4b; --text: #e6eaf0; --muted: #97a3b4;
    --accent: #e0a84a; --accent-soft: #3a2f1b; --teal: #5fb7b5; --teal-soft: #183333; --red: #ef6b6b;
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #12161c; --surface: #1a2029; --cell: #252d39; --line: #323c4b; --text: #e6eaf0; --muted: #97a3b4;
    --accent: #e0a84a; --accent-soft: #3a2f1b; --teal: #5fb7b5; --teal-soft: #183333; --red: #ef6b6b;
    color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14.5px/1.5 var(--body); -webkit-tap-highlight-color: transparent; font-variant-numeric: tabular-nums; }
  html { overflow-x: hidden; }
  body { padding: 0 max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    max-width: 1180px; margin: 0 auto; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 1px solid transparent; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; }
  button:hover { background: var(--cell); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  select, input[type=text], input[type=password], textarea {
    background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; min-width: 0; }
  select { cursor: pointer; }
  select:focus, input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  code { font-family: var(--mono); font-size: .9em; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  .sub { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* header */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center;
    gap: 8px; padding: calc(14px + env(safe-area-inset-top)) 0 12px; flex-wrap: wrap; border-bottom: 1px dashed var(--line); margin-bottom: 14px; }
  header h1 { font-family: var(--display); font-size: 22px; line-height: 1; margin: 0 10px 0 0; font-weight: 700;
    display: flex; align-items: center; gap: 8px; }
  header h1::before { content: ""; width: 14px; height: 14px; border-radius: 2px; background: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-soft); }
  nav { display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
  nav button { color: var(--muted); }
  nav button.on { color: var(--text); background: var(--cell); border-color: var(--line); }
  /* top-level switch: Tickets | Devlog */
  nav.section button { font-size: 13.5px; padding: 5px 14px; }
  nav.section button.on { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
  .spacer { flex: 1; }
  .sync { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
    display: flex; align-items: center; gap: 6px; min-width: 0; }
  .sync span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sync i { width: 8px; height: 8px; border-radius: 2px; background: var(--ok); flex: none; }
  .sync.busy i { background: var(--warn); } .sync.error i { background: var(--bug); } .sync.error { color: var(--red); }
  #settingsBtn { font-size: 16px; padding: 3px 8px; border-color: var(--line); background: var(--surface); }

  /* type marks */
  .mark { display: inline-block; width: 9px; height: 9px; flex: none; }
  .mark.task { background: var(--task); border-radius: 2px; }
  .mark.bug { background: var(--bug); border-radius: 50%; }
  .mark.epic { background: var(--epic); transform: rotate(45deg) scale(.85); border-radius: 1px; }

  /* add bar */
  .add { display: flex; gap: 6px; margin: 0 0 16px; }
  .add input { flex: 1; min-width: 0; }
  .add #addEpic { max-width: 180px; }
  .prio { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 0 5px; border-radius: 3px;
    background: var(--cell); color: var(--muted); }
  .prio.high { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
  .prio.mid { color: var(--accent); background: var(--accent-soft); }

  /* board */
  .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
  .board { row-gap: 0; }
  .col { min-height: 44px; border-radius: 6px; padding: 2px; }
  .col.drop { background: var(--accent-soft); outline: 1px dashed var(--accent); }
  .colhead { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em;
    margin: 0 0 8px; padding: 0 2px; display: flex; align-items: center; gap: 8px; }
  /* inventory-style count tiles */
  .colhead .n, .lane .n, .tabs .n { font-family: var(--body); font-weight: 700; font-size: 12px; letter-spacing: 0; color: var(--text);
    min-width: 24px; height: 24px; padding: 0 5px; display: inline-flex; align-items: center; justify-content: center;
    background: var(--cell); border: 2px solid var(--line); border-radius: 4px; }
  .colhead[data-s="in-progress"] .n, .tabs [data-col="in-progress"] .n { border-color: var(--accent); }
  .colhead[data-s="resolved"] .n, .tabs [data-col="resolved"] .n { border-color: var(--teal); }
  .colhead[data-s="in-progress"] { color: var(--accent); }
  .colhead[data-s="resolved"] { color: var(--teal); }
  .lane { grid-column: 1 / -1; font-size: 14px; font-weight: 700; padding: 12px 2px 8px; margin-top: 8px;
    border-top: 1px dashed var(--line); display: flex; gap: 8px; align-items: center; }
  .lane .n { min-width: 20px; height: 20px; font-size: 11px; border-width: 1px; color: var(--muted); }
  .lane[data-open] { cursor: pointer; } .lane[data-open]:hover { color: var(--accent); }
  .lane-empty { grid-column: 1 / -1; }
  .colhead button { margin-left: auto; font-family: var(--body); font-size: 11px; text-transform: none; letter-spacing: 0; padding: 2px 8px;
    color: var(--muted); border-color: var(--line); background: var(--surface); }
  .card { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 6px; padding: 9px 11px;
    margin-bottom: 6px; cursor: pointer; display: flex; gap: 9px; align-items: baseline; user-select: none; }
  .card.in-progress { border-left-color: var(--accent); }
  .card.resolved { border-left-color: var(--teal); }
  .card:hover { border-color: var(--muted); }
  .card.in-progress:hover { border-color: var(--accent); }
  .card.resolved:hover { border-color: var(--teal); }
  .card.dragging { opacity: .4; }
  .card .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  .card .meta { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; }
  .card.resolved .t > div:first-child { color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 4px; }
  .seg.tabs { display: none; }

  /* epics + archive lists */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .list:has(> .empty:only-child) { background: none; border-style: dashed; }
  .list .row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border-bottom: 1px dashed var(--line); cursor: pointer; }
  .list .row:last-child { border-bottom: 0; }
  .list .row:hover { background: var(--cell); }
  .list .row .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
  .list .row button { border-color: var(--line); background: var(--cell); }
  .list .row button:hover { border-color: var(--muted); }
  /* progress as a strip of inventory slots */
  .bar { width: 120px; height: 10px; background: var(--cell); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; flex: none; }
  .bar > div { height: 100%; background: repeating-linear-gradient(90deg, var(--teal) 0 10px, transparent 10px 12px); }
  .pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--cell); color: var(--muted); white-space: nowrap; }
  .pill[data-s="in-progress"] { background: var(--accent-soft); color: var(--accent); }
  .pill[data-s="resolved"] { background: var(--teal-soft); color: var(--teal); }

  /* modal */
  .scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .55); z-index: 20; display: flex;
    align-items: flex-start; justify-content: center; padding: 6vh 12px; overflow: auto; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; width: 100%; max-width: 620px;
    padding: 18px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
  .modal .title { width: 100%; font-size: 19px; font-weight: 700; border-color: transparent; padding: 4px 6px; margin-left: -6px; margin-top: 6px; }
  .modal .title:hover { border-color: var(--line); }
  .modal .id { font-family: var(--mono); font-size: 12px; }
  .modal > div:first-child { padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  #closeBtn { border-color: var(--line); background: var(--cell); }
  .fields { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; padding: 2px; background: var(--bg); }
  .seg button { padding: 4px 10px; font-size: 13px; color: var(--muted); }
  .seg button.on { background: var(--cell); color: var(--text); border-color: var(--line); }
  .seg button[data-s="in-progress"].on, .seg button[data-col="in-progress"].on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .seg button[data-s="resolved"].on, .seg button[data-col="resolved"].on { background: var(--teal-soft); color: var(--teal); border-color: var(--teal); }
  .modal textarea { width: 100%; min-height: 140px; resize: vertical; line-height: 1.5; background: var(--bg); }
  .modal footer { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 12px; font-size: 12px;
    border-top: 1px dashed var(--line); }
  .modal footer > .muted:first-child { font-family: var(--mono); font-size: 11.5px; }
  .modal footer button:not(.primary) { border-color: var(--line); background: var(--cell); }
  .danger { color: var(--red); }
  .modal footer button.danger:hover, .list .row button.danger:hover { border-color: var(--red); }
  .children { margin-top: 12px; }
  .children.list { background: none; border: 0; border-radius: 0; }
  .children .row { padding: 7px 4px; }
  label.f { display: block; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 12px 0 5px; }
  label.f .muted { text-transform: none; letter-spacing: 0; font-weight: 400; font-family: var(--body); }
  .modal input.full { width: 100%; background: var(--bg); }
  .modal b { font-family: var(--display); font-size: 18px; }
  summary { cursor: pointer; }
  .primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); padding: 7px 14px; font-weight: 700; }
  .primary:hover { background: var(--accent); filter: brightness(1.08); }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* devlog (BestProjectEver) */
  .dl-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .dl-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .dl-head h2 { font-family: var(--display); font-size: 26px; line-height: 1.1; margin: 2px 0 0; font-weight: 700; }
  .dl-stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .dl-stats span { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; color: var(--muted); font-size: 12.5px; }
  .dl-stats b { color: var(--text); font-size: 18px; margin-right: 4px; }
  .dl-bars { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; max-width: 820px; }
  .dl-barrow { display: grid; grid-template-columns: 56px minmax(0, 1fr) 24px; gap: 10px; align-items: center; font-family: var(--mono); font-size: 12px; }
  .dl-cells { display: flex; flex-wrap: wrap; gap: 3px; }
  .dl-cells i { width: 14px; height: 14px; border-radius: 2px; background: var(--accent); }
  .dl-cells em { font-style: normal; color: var(--muted); }
  .dl-list { display: flex; flex-direction: column; gap: 16px; max-width: 820px; }
  .dl-day { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; }
  .dl-tile { width: 56px; height: 56px; border-radius: 4px; background: var(--cell); border: 2px solid var(--accent); display: flex;
    flex-direction: column; align-items: center; justify-content: center; gap: 3px; line-height: 1; }
  .dl-tile small { font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--muted); }
  .dl-tile b { font-size: 24px; font-weight: 700; }
  .dl-card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex;
    flex-direction: column; gap: 10px; min-width: 0; }
  .dl-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .dl-edit, .dl-actions button:not(.primary) { border-color: var(--line); background: var(--cell); }
  .dl-card h3 { margin: 0; font-size: 16px; font-weight: 600; text-wrap: balance; }
  .dl-sum { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
  .dl-video { position: relative; display: block; width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden;
    background: var(--cell); border: 1px solid var(--line); padding: 0; }
  .dl-video iframe, .dl-video img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  .dl-play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 68px; height: 48px; border-radius: 12px;
    background: var(--red); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 4px 18px rgba(0, 0, 0, .35); }
  .dl-thumb:hover { background: var(--cell); } .dl-thumb:hover .dl-play, .dl-thumb:focus-visible .dl-play { filter: brightness(1.12); }
  .dl-yt { text-decoration: none; align-self: flex-start; } .dl-yt:hover { color: var(--accent); }
  .dl-novideo { border: 1px dashed var(--line); border-radius: 6px; padding: 10px 12px; }
  .dl-tickets { border-top: 1px dashed var(--line); padding-top: 10px; }
  .dl-label { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .dl-tickets ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .dl-tickets li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; font-size: 13.5px; }
  .dl-tickets code { color: var(--muted); }
  .dl-form { border-top: 1px dashed var(--line); display: flex; flex-direction: column; }
  .dl-form input, .dl-form textarea { width: 100%; background: var(--bg); }
  .dl-form textarea { min-height: 110px; resize: vertical; }
  .dl-actions { display: flex; gap: 6px; }
  .dl-actions .dl-del { margin-left: auto; color: var(--red); }

  /* devlog budget */
  .dl-budget { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; margin-bottom: 18px;
    max-width: 820px; display: flex; flex-direction: column; gap: 10px; }
  .dl-btop { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .dl-btop h3 { margin: 0; font-family: var(--display); font-size: 18px; font-weight: 700; }
  .dl-btop button { border-color: var(--line); background: var(--cell); }
  .dl-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .dl-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 12px; align-items: center; padding: 8px 0;
    border-bottom: 1px dashed var(--line); }
  .dl-item .sub { grid-column: 1; }
  .dl-item .amt { font-family: var(--mono); font-weight: 600; grid-row: 1 / span 2; grid-column: 2; }
  .dl-item button { grid-row: 1 / span 2; grid-column: 3; color: var(--muted); }
  .dl-total { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; }
  .dl-total .amt { font-family: var(--mono); color: var(--accent); font-size: 16px; }
  .dl-bform { border-top: 1px dashed var(--line); display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0 10px; }
  .dl-bform > div { display: flex; flex-direction: column; min-width: 0; }
  .dl-bform .wide { grid-column: 1 / -1; }
  .dl-bform input { width: 100%; background: var(--bg); }

  @media (max-width: 720px) {
    .dl-bform { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .dl-bform > div:first-child { grid-column: 1 / -1; }
    .dl-budget { padding: 12px; }
    .dl-day { grid-template-columns: 44px minmax(0, 1fr); gap: 10px; }
    .dl-tile { width: 44px; height: 44px; } .dl-tile b { font-size: 19px; }
    .dl-card { padding: 12px; }
    header h1 { display: none; }
    .board { grid-template-columns: minmax(0, 1fr); }
    .seg.tabs { display: flex; margin-bottom: 10px; }
    .add { flex-wrap: wrap; }
    .add input, .add #addBtn { order: -1; }
    .add input { flex-basis: calc(100% - 70px); }
    .add #addEpic, .add #addPrio { flex: 1; max-width: none; min-width: 0; }
    .tabs button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 4px; white-space: nowrap; }
    .tabs .n { min-width: 20px; height: 20px; font-size: 11px; }
    .board .col { display: none; } .board .col.show { display: block; }
    .colhead, .lane.mhide { display: none; }
    .bar { width: 60px; }
    .list .row { flex-wrap: wrap; }
    .scrim { padding: 0; align-items: stretch; }
    .modal { border-radius: 0; min-height: 100%; border: 0; padding-top: calc(18px + env(safe-area-inset-top)); }
    .card { padding: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>David's</h1>
  <nav id="section" class="section" aria-label="Section">
    <button data-section="tickets" class="on">Tickets</button>
    <button data-section="devlog">Devlog</button>
  </nav>
  <nav id="nav" aria-label="Ticket views">
    <button data-view="board" class="on">Board</button>
    <button data-view="epics">Epics</button>
    <button data-view="archive">Archive</button>
  </nav>
  <select id="epicFilter" title="Show tickets from one epic"></select>
  <div class="spacer"></div>
  <div class="sync" id="sync" title="Sync status"><i></i><span>…</span></div>
  <button id="settingsBtn" title="Settings">⚙</button>
</header>

<main id="main"></main>
<div id="modalRoot"></div>

<script>
// ============ storage format (shared with tickets.py) ============
// { version: 1, nextId, tickets: [{ id, type: epic|task|bug, title, status: todo|in-progress|resolved,
//   epic: id|null, priority: 1-10|null (1 = highest), description, created, updated, archived }] }
const STATUSES = [["todo", "To do"], ["in-progress", "In progress"], ["resolved", "Resolved"]];
const STATUS_LABEL = Object.fromEntries(STATUSES);
const TYPES = [["task", "Task"], ["bug", "Bug"], ["epic", "Epic"]];
const PRIORITIES = Array.from({ length: 10 }, (_, i) => i + 1); // 1 = highest
const prioOptions = (sel, none = "No priority") => `<option value="">${none}</option>` +
  PRIORITIES.map((p) => `<option value="${p}" ${sel === p ? "selected" : ""}>P${p}${p === 1 ? " (highest)" : ""}</option>`).join("");
// higher priority first; tickets without one go last, then by id
const byPriority = (a, b) => (a.priority ?? 99) - (b.priority ?? 99) || a.id - b.id;
const POLL_MS = 30000;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const now = () => new Date().toISOString().replace(/\.\d+Z$/, "Z");

// ============ settings (per device) ============
const cfg = JSON.parse(localStorage.getItem("tickets.cfg") || "{}");
cfg.branch ||= "main"; cfg.path ||= "tickets.json"; cfg.api ||= "https://api.github.com";
const saveCfg = () => localStorage.setItem("tickets.cfg", JSON.stringify(cfg));
const configured = () => cfg.owner && cfg.repo && cfg.token;

// ============ GitHub contents API ============
const fileUrl = (path = cfg.path) => `${cfg.api}/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${path}`;
const headers = () => ({ Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json" });

function b64decode(b64) {
  const bin = atob(b64.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

async function fetchRemote(path) {
  const r = await fetch(`${fileUrl(path)}?ref=${encodeURIComponent(cfg.branch)}`, { headers: headers(), cache: "no-store" });
  if (r.status === 404) return { data: { version: 1, nextId: 1, tickets: [] }, sha: null };
  if (r.status === 401) throw new Error("GitHub rejected the token — check Settings");
  if (!r.ok) throw new Error(`GitHub error ${r.status}`);
  const j = await r.json();
  return { data: JSON.parse(b64decode(j.content)), sha: j.sha };
}

async function pushRemote(text, sha, message, path) {
  const body = { message, content: b64encode(text), branch: cfg.branch };
  if (sha) body.sha = sha;
  const r = await fetch(fileUrl(path), { method: "PUT", headers: { ...headers(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (r.status === 409 || r.status === 422) { const e = new Error("conflict"); e.conflict = true; throw e; }
  if (r.status === 401 || r.status === 403) throw new Error("GitHub refused the write — the token needs Contents: read & write");
  if (!r.ok) throw new Error(`GitHub error ${r.status}`);
  return (await r.json()).content.sha;
}

const serialize = (data) => JSON.stringify(data, null, 2) + "\n";

// ============ operations ============
// Changes are recorded as replayable ops, so if another device saved first we
// re-apply them on top of its version. `map` remaps ids of tickets created in this batch.
function apply(data, op, map) {
  const id = (x) => (x != null && map[x] != null ? map[x] : x);
  const find = (x) => data.tickets.find((t) => t.id === id(x));
  switch (op.kind) {
    case "create": {
      // already there? (a save went through but its reply was lost) - don't add it twice
      const same = data.tickets.find((k) => k.created === op.ticket.created && k.title === op.ticket.title && k.type === op.ticket.type);
      if (same) { map[op.ticket.id] = same.id; break; }
      const t = { ...op.ticket, id: data.nextId++, epic: id(op.ticket.epic) ?? null };
      map[op.ticket.id] = t.id;
      data.tickets.push(t);
      break;
    }
    case "update": {
      const t = find(op.id); if (!t) break;
      const patch = { ...op.patch };
      if ("epic" in patch) patch.epic = id(patch.epic) ?? null;
      if (patch.type && patch.type !== "epic" && t.type === "epic")
        data.tickets.forEach((k) => { if (k.epic === t.id) k.epic = null; });
      if (patch.type === "epic") patch.epic = null;
      if (patch.status && patch.status !== t.status) patch.statusChanged = op.at;
      Object.assign(t, patch, { updated: op.at });
      break;
    }
    case "archive": {
      for (const x of op.ids) {
        const t = find(x); if (!t) continue;
        const group = [t, ...(t.type === "epic" ? data.tickets.filter((k) => k.epic === t.id) : [])];
        group.forEach((k) => { if (!!k.archived !== op.value) { k.archived = op.value; k.updated = op.at; } });
      }
      break;
    }
    case "delete": {
      const gone = new Set();
      for (const x of op.ids) {
        const t = find(x); if (!t) continue;
        gone.add(t.id);
        if (t.type === "epic") data.tickets.forEach((k) => {
          if (k.epic === t.id) { if (k.archived) gone.add(k.id); else k.epic = null; }
        });
      }
      data.tickets = data.tickets.filter((t) => !gone.has(t.id));
      break;
    }
  }
}

// ============ sync engine ============
const state = {
  data: JSON.parse(localStorage.getItem("tickets.cache") || "null"),
  sha: localStorage.getItem("tickets.sha"),
  pending: [], flushing: false, error: null,
  view: localStorage.getItem("tickets.view") || "board", ticketView: localStorage.getItem("tickets.ticketView") || "board",
  epic: localStorage.getItem("tickets.epic") || "all", mobileCol: "todo",
  openId: null,
};

function cache() {
  localStorage.setItem("tickets.cache", JSON.stringify(state.data));
  if (state.sha) localStorage.setItem("tickets.sha", state.sha);
}

function setSync() {
  const el = $("#sync");
  const busy = state.flushing || state.pending.length;
  el.className = "sync" + (state.error ? " error" : busy ? " busy" : "");
  $("span", el).textContent = state.error ? state.error : busy ? "Saving…" : "Synced";
}

function op(o, message) {
  o.at = now();
  apply(state.data, o, {});
  state.pending.push({ op: o, message });
  cache(); render(); flush();
}

async function flush() {
  if (state.flushing || !state.pending.length) return;
  state.flushing = true; setSync();
  try {
    while (state.pending.length) {
      const batch = state.pending.length;
      const message = state.pending.map((p) => p.message).join("; ");
      try {
        state.sha = await pushRemote(serialize(state.data), state.sha, message);
        state.pending.splice(0, batch);
        state.error = null;
      } catch (e) {
        if (!e.conflict) throw e;
        // someone else saved first: take theirs and replay ours on top
        const remote = await fetchRemote();
        const map = {};
        state.pending.forEach((p) => apply(remote.data, p.op, map));
        if (state.openId != null && map[state.openId] != null) state.openId = map[state.openId];
        state.data = remote.data; state.sha = remote.sha;
        render();
      }
      cache();
    }
  } catch (e) {
    state.error = navigator.onLine ? e.message : "Offline — will retry";
    setTimeout(flush, 5000);
  } finally {
    state.flushing = false; setSync();
  }
}

async function refresh() {
  if (state.view === "devlog") dlRefresh();
  if (!configured() || state.flushing || state.pending.length) return;
  try {
    const remote = await fetchRemote();
    state.error = null;
    if (remote.sha !== state.sha || !state.data) {
      state.data = remote.data; state.sha = remote.sha; cache(); render();
    }
  } catch (e) { state.error = navigator.onLine ? e.message : "Offline"; }
  setSync();
}

// ============ helpers ============
const tickets = () => state.data?.tickets ?? [];
const byId = (id) => tickets().find((t) => t.id === id);
const epics = (archived = false) => tickets().filter((t) => t.type === "epic" && !!t.archived === archived);
const childrenOf = (eid) => tickets().filter((t) => t.epic === eid && !t.archived);
const mark = (type) => `<span class="mark ${type}" title="${type}"></span>`;

function createTicket(fields) {
  const t = { id: state.data.nextId, type: "task", title: "", status: "todo", epic: null, priority: null,
    description: "", created: now(), updated: now(), statusChanged: now(), archived: false, ...fields };
  op({ kind: "create", ticket: t }, `Add ${t.type}: ${t.title}`);
  return state.data.nextId - 1;
}
const update = (id, patch, what) => op({ kind: "update", id, patch }, `#${id} ${what}`);

// ============ rendering ============
function render() {
  setSync();
  const section = state.view === "devlog" ? "devlog" : "tickets";
  document.querySelectorAll("#section button").forEach((b) => b.classList.toggle("on", b.dataset.section === section));
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.view === state.view));
  $("#nav").classList.toggle("hidden", section !== "tickets");
  const main = $("#main");
  if (!configured()) {
    main.innerHTML = `<div class="empty" style="padding:40px 0">Connect your GitHub repo to get started.
      <p><button class="primary" onclick="openSettings()">Open settings</button></p></div>`;
    $("#epicFilter").classList.add("hidden");
    return;
  }
  if (!state.data) { main.innerHTML = `<div class="empty">Loading…</div>`; return; }

  // epic filter
  const ef = $("#epicFilter");
  ef.classList.toggle("hidden", state.view !== "board");
  if (state.epic !== "all" && state.epic !== "none" && !epics().some((e) => String(e.id) === state.epic)) state.epic = "all";
  ef.innerHTML = `<option value="all">All tickets</option><option value="none">No epic</option>` +
    epics().map((e) => `<option value="${e.id}">${esc(e.title)}</option>`).join("");

  if (state.view === "board") renderBoard(main);
  else if (state.view === "epics") renderEpics(main);

}

function renderBoard(main) {

    </form>
    <div class="tabs seg">${cols.map((c) => `<button data-col="${c.s}" class="${state.mobileCol === c.s ? "on" : ""}">${c.label} <span class="n">${c.items.length}</span></button>`).join("")}</div>
    <div class="board">${cols.map((c) => `
      <h2 class="colhead" data-s="${c.s}">${c.label} <span class="n">${c.items.length}</span>

      ${!visible.length ? `<div class="empty lane-empty">Nothing here</div>` : showLanes ? lanes.map((l) => `
      <div class="lane ${l.cols[STATUSES.findIndex(([s]) => s === state.mobileCol)].length ? "" : "mhide"}"
        ${l.epic != null ? `data-open="${l.epic}" title="Open epic"` : ""}>${esc(l.title)}
        <span class="n">${l.cols.reduce((n, items) => n + items.length, 0)}</span></div>
      ${cols.map((c, i) => cell(c, l.cols[i], l.epic)).join("")}`).join("")

  $("#addType").value = localStorage.getItem("tickets.addType") || "task";
  $("#addType").onchange = (e) => localStorage.setItem("tickets.addType", e.target.value);
  // the epic picker follows the board filter, and keeps a manual choice until the filter changes
  const addEpic = $("#addEpic");
  if (state.addEpicFilter !== state.epic) { state.addEpic = null; state.addEpicFilter = state.epic; }

  $("#addForm").onsubmit = (e) => {
    e.preventDefault();

function cardHtml(t) {

// ============ devlog (BestProjectEver) ============
// devlog.json next to tickets.json, also written by ~/.claude/skills/BPEDay/bpeday.py:
// { version: 1, days: [{ day, date: "YYYY-MM-DD", title, summary: [..], youtube, tickets: [{ id, title }] }],
//   budget: [{ id, date: "YYYY-MM-DD", item, amount, currency: "CAD", note }] }   (budget = what the project has cost so far)
const devlogPath = () => cfg.path.replace(/[^/]*$/, "devlog.json");
// older caches (and devlog.json files) have no budget list yet
const dlNormal = (data) => { const d = data && Array.isArray(data.days) ? data : { version: 1, days: [] };
  if (!Array.isArray(d.budget)) d.budget = []; return d; };
const dlCached = JSON.parse(localStorage.getItem("devlog.cache") || "null");
const dl = { data: dlCached && dlNormal(dlCached), sha: localStorage.getItem("devlog.sha"),
  error: null, editing: null, playing: null, saving: false, bEditing: null };
const dlCache = () => { localStorage.setItem("devlog.cache", JSON.stringify(dl.data)); if (dl.sha) localStorage.setItem("devlog.sha", dl.sha); };

async function dlRefresh() {
  if (!configured() || dl.saving) return;
  try {
    const r = await fetchRemote(devlogPath());
    dl.error = null;
    if (r.sha !== dl.sha || !dl.data) {
      dl.data = dlNormal(r.data); dl.sha = r.sha; dlCache();
      if (state.view === "devlog") render();
    }
  } catch (e) { dl.error = e.message; if (state.view === "devlog" && !dl.data) render(); }
}

// Apply fn to the latest devlog.json and push it (re-reads and retries if another device saved first).
async function dlChange(message, fn) {
  dl.saving = true;
  try {
    for (let i = 0; i < 3; i++) {
      const r = await fetchRemote(devlogPath());
      const data = dlNormal(r.data);
      fn(data);
      try {
        dl.sha = await pushRemote(serialize(data), r.sha, message, devlogPath());
        dl.data = data; dlCache(); return;
      } catch (e) { if (!e.conflict) throw e; }
    }
    throw new Error("Couldn't save: the devlog kept changing. Try again.");
  } finally { dl.saving = false; }
}
const dlSave = (dayNum, patch) => dlChange(`Devlog: day ${dayNum}`, (data) => {
  const d = data.days.find((x) => x.day === dayNum);
  if (!d) throw new Error(`Day ${dayNum} no longer exists`);
  Object.assign(d, patch);
});
const money = (n, cur = "CAD") => { try { return new Intl.NumberFormat("en-CA", { style: "currency", currency: cur }).format(n); }
  catch { return `${(+n).toFixed(2)} ${cur}`; } };
const todayIso = () => { const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

function ytId(url) {
  try {
    const u = new URL(url);
    if (u.hostname === "youtu.be") return u.pathname.slice(1).split("/")[0] || null;
    if (u.hostname === "youtube.com" || u.hostname.endsWith(".youtube.com")) {
      if (u.searchParams.get("v")) return u.searchParams.get("v");
      const m = u.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]+)/);
      return m ? m[1] : null;
    }
  } catch {}
  return null;
}
const fmtDay = (iso) => { const d = new Date(iso + "T12:00:00");
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" }); };

function renderDevlog(main) {
  if (!dl.data) { main.innerHTML = `<div class="empty">${dl.error ? esc(dl.error) : "Loading the devlog…"}</div>`; dlRefresh(); return; }
  // keep a half-typed edit when a background refresh re-renders

  const spent = dl.data.budget.reduce((n, b) => n + (+b.amount || 0), 0);
  const days = [...dl.data.days].sort((a, b) => a.day - b.day);
  const nT = days.reduce((n, d) => n + (d.tickets || []).length, 0);
  const nV = days.filter((d) => ytId(d.youtube || "")).length;
  main.innerHTML = `
    <div class="dl-head"><div><div class="dl-eyebrow">BestProjectEver</div><h2>Devlog</h2></div>
      <div class="dl-stats"><span><b>${days.length}</b>days</span><span><b>${nT}</b>tickets resolved</span><span><b>${nV}</b>videos</span><span><b>${money(spent)}</b>spent</span></div></div>
    ${budgetHtml(spent)}
    ${days.length ? `<div class="dl-bars" aria-label="Tickets resolved per day">${days.map((d) => { const n = (d.tickets || []).length;
      return `<div class="dl-barrow"><span>Day ${d.day}</span><span class="dl-cells">${n ? "<i></i>".repeat(n) : "<em>none</em>"}</span><span>${n}</span></div>`; }).join("")}</div>` : ""}
    <div class="dl-list">${[...days].reverse().map(dayHtml).join("") ||
      `<div class="empty">No days yet. Run <code>/BPEDay</code> in Claude to log the first one.</div>`}</div>`;
  if (keep) { $("#dlYt").value = keep.yt; $("#dlTitle").value = keep.title; $("#dlSum").value = keep.sum; }
  if (bKeep) B_FIELDS.forEach((k, i) => $("#" + k).value = bKeep[i]);
}

const B_FIELDS = ["bItem", "bAmt", "bDate", "bNote"];
function budgetHtml(spent) {
  const items = [...dl.data.budget].sort((a, b) => (a.date || "").localeCompare(b.date || "") || a.id - b.id);
  const e = dl.bEditing === "new" ? { date: todayIso(), item: "", amount: "", note: "" } : items.find((b) => b.id === dl.bEditing);
  return `<section class="dl-budget" aria-label="Budget">
    <div class="dl-btop"><h3>Budget</h3>${dl.bEditing == null ? `<button data-bedit="new">+ Add expense</button>` : ""}</div>
    ${items.length ? `<ul class="dl-items">${items.map((b) => `<li class="dl-item">
        <span>${esc(b.item)}</span><span class="amt">${money(+b.amount || 0, b.currency || "CAD")}</span>
        <button data-bedit="${b.id}" aria-label="Edit ${esc(b.item)}">Edit</button>
        <span class="sub">${esc(fmtDay(b.date))}${b.note ? ` · ${esc(b.note)}` : ""}</span></li>`).join("")}</ul>
      <div class="dl-total"><span>Total spent</span><span class="amt">${money(spent)}</span></div>`
      : `<div class="empty">Nothing spent yet.</div>`}
    ${e ? `<form class="dl-bform" data-bform>
      <div><label class="f" for="bItem">What</label><input type="text" id="bItem" value="${esc(e.item)}" placeholder="Claude Pro, 1 month" autocomplete="off"></div>
      <div><label class="f" for="bAmt">Amount (CAD)</label><input type="text" id="bAmt" inputmode="decimal" value="${esc(e.amount)}" placeholder="0.00" autocomplete="off"></div>
      <div><label class="f" for="bDate">Date</label><input type="text" id="bDate" value="${esc(e.date)}" placeholder="YYYY-MM-DD" autocomplete="off"></div>
      <div class="wide"><label class="f" for="bNote">Note <span class="muted">optional</span></label><input type="text" id="bNote" value="${esc(e.note || "")}" autocomplete="off"></div>
      <div class="wide"><div class="err" id="bErr"></div>
        <div class="dl-actions"><button type="submit" class="primary">Save</button><button type="button" data-bcancel>Cancel</button>
        ${dl.bEditing !== "new" ? `<button type="button" class="dl-del" data-bdel>Delete</button>` : ""}</div></div></form>` : ""}
  </section>`;
}

function dayHtml(d) {
  const id = ytId(d.youtube || ""), editing = dl.editing === d.day, tk = d.tickets || [];
  const video = !id ? `<div class="empty dl-novideo">No video yet. Add one with <code>/BPEDay &lt;link&gt;</code> or Edit.</div>`
    : dl.playing === d.day
      ? `<div class="dl-video"><iframe src="https://www.youtube-nocookie.com/embed/${esc(id)}?autoplay=1&rel=0" title="Day ${d.day} video"
          allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`
      : `<button class="dl-video dl-thumb" data-play="${d.day}" aria-label="Play the day ${d.day} video">
          <img src="https://i.ytimg.com/vi/${esc(id)}/hqdefault.jpg" alt="" loading="lazy"><span class="dl-play" aria-hidden="true">▶</span></button>`;
  return `<article class="dl-day">
    <div class="dl-tile" aria-hidden="true"><small>DAY</small><b>${d.day}</b></div>
    <div class="dl-card">
      <div class="dl-top"><span class="sub">${esc(fmtDay(d.date))}</span>${editing ? "" : `<button class="dl-edit" data-dledit="${d.day}">Edit</button>`}</div>
      <h3>${esc(d.title || "Untitled day")}</h3>
      ${(d.summary || []).length ? `<ul class="dl-sum">${d.summary.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>` : ""}
      ${video}
      ${id ? `<a class="sub dl-yt" href="${esc(d.youtube)}" target="_blank" rel="noopener">Open on YouTube ↗</a>` : ""}
      <div class="dl-tickets"><div class="dl-label">Tickets resolved (${tk.length})</div>
        ${tk.length ? `<ul>${tk.map((t) => `<li><code>#${esc(t.id)}</code><span>${esc(t.title)}</span></li>`).join("")}</ul>` : `<div class="empty">None this day.</div>`}</div>
      ${editing ? `<form class="dl-form" data-dlform="${d.day}">
        <label class="f" for="dlYt">YouTube link</label><input type="text" id="dlYt" value="${esc(d.youtube || "")}" placeholder="https://youtu.be/…" autocomplete="off">
        <label class="f" for="dlTitle">Headline</label><input type="text" id="dlTitle" value="${esc(d.title || "")}">
        <label class="f" for="dlSum">Summary <span class="muted">one point per line</span></label><textarea id="dlSum">${esc((d.summary || []).join("\n"))}</textarea>
        <div class="err" id="dlErr"></div>
        <div class="dl-actions"><button type="submit" class="primary">Save</button><button type="button" data-dlcancel>Cancel</button></div></form>` : ""}
    </div></article>`;
}

document.addEventListener("click", (e) => {
  const p = e.target.closest("[data-play]");
  if (p) { dl.playing = +p.dataset.play; render(); return; }
  const ed = e.target.closest("[data-dledit]");
  if (ed) { dl.editing = +ed.dataset.dledit; render(); $("#dlYt")?.focus(); return; }
  if (e.target.closest("[data-dlcancel]")) { dl.editing = null; render(); return; }
  const be = e.target.closest("[data-bedit]");
  if (be) { dl.bEditing = be.dataset.bedit === "new" ? "new" : +be.dataset.bedit; render(); $("#bItem")?.focus(); return; }
  if (e.target.closest("[data-bcancel]")) { dl.bEditing = null; render(); return; }
  if (e.target.closest("[data-bdel]")) {
    const id = dl.bEditing, b = dl.data.budget.find((x) => x.id === id);
    if (!b || !confirm(`Remove "${b.item}" from the budget?`)) return;
    $("#bErr").textContent = "Saving…";
    dlChange(`Budget: remove ${b.item}`, (data) => { data.budget = data.budget.filter((x) => x.id !== id); })
      .then(() => { dl.bEditing = null; render(); }, (x) => { $("#bErr").textContent = x.message; });
  }
});
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("[data-bform]"); if (!f) return;
  e.preventDefault();
  const item = $("#bItem").value.trim(), date = $("#bDate").value.trim(), note = $("#bNote").value.trim(),
    amount = Math.round(parseFloat($("#bAmt").value.replace(",", ".").replace(/[^\d.]/g, "")) * 100) / 100;
  if (!item) { $("#bErr").textContent = "Say what it was."; return; }
  if (!(amount >= 0)) { $("#bErr").textContent = "The amount should be a number, like 28.00."; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { $("#bErr").textContent = "Use a date like 2026-11-09."; return; }
  $("#bErr").textContent = "Saving…";
  const id = dl.bEditing;
  try {
    await dlChange(`Budget: ${item}`, (data) => {
      if (id === "new") data.budget.push({ id: Math.max(0, ...data.budget.map((b) => b.id || 0)) + 1, date, item, amount, currency: "CAD", note });
      else { const b = data.budget.find((x) => x.id === id); if (!b) throw new Error("That expense no longer exists");
        Object.assign(b, { date, item, amount, note }); }
    });
    dl.bEditing = null; render();
  } catch (x) { $("#bErr").textContent = x.message; }
});
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("[data-dlform]"); if (!f) return;
  e.preventDefault();
  const day = +f.dataset.dlform, yt = $("#dlYt").value.trim();
  if (yt && !ytId(yt)) { $("#dlErr").textContent = "That isn't a YouTube video link. Use the link from YouTube's Share button."; return; }
  $("#dlErr").textContent = "Saving…";
  try {
    await dlSave(day, { youtube: yt, title: $("#dlTitle").value.trim(),
      summary: $("#dlSum").value.split("\n").map((s) => s.trim()).filter(Boolean) });
    dl.editing = null; render();
  } catch (x) { $("#dlErr").textContent = x.message; }
});

// ============ ticket modal ============
function openTicket(id) { state.openId = id; renderModal(); }
function closeModal() {
  commitText();
  state.openId = null; $("#modalRoot").innerHTML = ""; render();
}
function commitText() {
  const t = byId(state.openId), m = $("#modalRoot .modal[data-id]");
  if (!t || !m) return;
  const title = $(".title", m).value.trim(), desc = $("textarea", m).value;
  const patch = {};
  if (title && title !== t.title) patch.title = title;
  if (desc !== (t.description || "")) patch.description = desc;
  if (Object.keys(patch).length) update(t.id, patch, "edited");
}

function renderModal() {
  const t = byId(state.openId);
  if (!t) { state.openId = null; $("#modalRoot").innerHTML = ""; return; }
  const root = $("#modalRoot");
  const existing = $(".modal", root);
  // keep what the user is typing if a sync re-render happens
  const keep = existing && +existing.dataset.id === t.id
    ? { title: $(".title", existing).value, desc: $("textarea", existing).value, focus: document.activeElement?.className } : null;
  const kids = t.type === "epic" ? childrenOf(t.id) : [];
  root.innerHTML = `
    <div class="scrim" id="scrim"><div class="modal" data-id="${t.id}">
      <div style="display:flex;align-items:center;gap:8px">${mark(t.type)}<span class="muted id">#${t.id}${t.archived ? " · archived" : ""}</span>
        <div class="spacer"></div><button id="closeBtn" title="Close (Esc)">✕</button></div>
      <input class="title" type="text" value="${esc(keep?.title ?? t.title)}" placeholder="Title">
      <div class="fields">
        <div class="seg" id="statusSeg">${STATUSES.map(([s, l]) => `<button data-s="${s}" class="${t.status === s ? "on" : ""}">${l}</button>`).join("")}</div>
        <select id="typeSel">${TYPES.map(([v, l]) => `<option value="${v}" ${t.type === v ? "selected" : ""}>${l}</option>`).join("")}</select>
        ${t.type === "epic" ? "" : `<select id="epicSel"><option value="">No epic</option>${epics().map((e) =>
          `<option value="${e.id}" ${t.epic === e.id ? "selected" : ""}>${esc(e.title)}</option>`).join("")}</select>`}
        ${t.type === "epic" ? "" : `<select id="prioSel" title="Priority (1 = highest)">${prioOptions(t.priority ?? null)}</select>`}
      </div>
      <textarea placeholder="Description, notes, links…">${esc(keep?.desc ?? t.description ?? "")}</textarea>
      ${t.type === "epic" ? `<div class="children list"><label class="f">${kids.length} ticket${kids.length === 1 ? "" : "s"} in this epic</label>
        ${kids.map((k) => `<div class="row" data-open="${k.id}">${mark(k.type)}<div class="t">${esc(k.title)}</div><span class="pill" data-s="${k.status}">${STATUS_LABEL[k.status]}</span></div>`).join("")}</div>` : ""}
      <footer><span class="muted">Created ${t.created.slice(0, 10)} · Updated ${t.updated.slice(0, 10)}</span><div class="spacer"></div>
        ${t.archived
          ? `<button id="restoreBtn">Restore</button><button class="danger" id="deleteBtn">Delete</button>`
          : `<button id="archiveBtn" title="${t.type === "epic" ? "Archives the epic and its tickets" : "Hide it in the archive"}">Archive</button>`}
      </footer>
    </div></div>`;
  const m = $(".modal", root);
  if (keep?.focus === "title") $(".title", m).focus();
  $("#scrim").onclick = (e) => { if (e.target.id === "scrim") closeModal(); };
  $("#closeBtn").onclick = closeModal;
  $(".title", m).onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); commitText(); } };
  $(".title", m).onblur = commitText;
  $("textarea", m).onblur = commitText;
  $("#statusSeg").onclick = (e) => {
    const b = e.target.closest("[data-s]");
    if (b && b.dataset.s !== t.status) { commitText(); update(t.id, { status: b.dataset.s }, `→ ${STATUS_LABEL[b.dataset.s]}`); }
  };
  $("#typeSel").onchange = (e) => {
    if (t.type === "epic" && kids.length && !confirm("This epic's tickets will no longer belong to an epic. Continue?")) { e.target.value = "epic"; return; }
    commitText(); update(t.id, { type: e.target.value }, `type → ${e.target.value}`);
  };
  $("#epicSel")?.addEventListener("change", (e) => { commitText(); update(t.id, { epic: e.target.value ? +e.target.value : null }, "epic changed"); });
  $("#prioSel")?.addEventListener("change", (e) => {
    const p = e.target.value ? +e.target.value : null;
    commitText(); update(t.id, { priority: p }, p ? `priority → P${p}` : "priority cleared");
  });
  $("#archiveBtn")?.addEventListener("click", () => { commitText(); op({ kind: "archive", ids: [t.id], value: true }, `Archive #${t.id}`); closeModal(); });
  $("#restoreBtn")?.addEventListener("click", () => op({ kind: "archive", ids: [t.id], value: false }, `Restore #${t.id}`));
  $("#deleteBtn")?.addEventListener("click", () => {
    if (confirm(`Delete #${t.id} for good?`)) { op({ kind: "delete", ids: [t.id] }, `Delete #${t.id}`); closeModal(); }
  });
}

// ============ settings ============
function openSettings() {
  $("#modalRoot").innerHTML = `
    <div class="scrim" id="scrim"><div class="modal">
      <div style="display:flex;align-items:center"><b>Settings</b><div class="spacer"></div><button id="closeBtn">✕</button></div>
      <p class="muted">Saved on this device only. Tickets live in <code>${esc(cfg.path)}</code> in your private GitHub repo.</p>
      <label class="f">GitHub username</label><input class="full" type="text" id="sOwner" value="${esc(cfg.owner || "")}" autocapitalize="off" autocorrect="off">
      <label class="f">Data repository</label><input class="full" type="text" id="sRepo" value="${esc(cfg.repo || "tickets")}" autocapitalize="off" autocorrect="off">
      <label class="f">Personal access token <span class="muted">(fine-grained, this repo only, Contents: read &amp; write)</span></label>
      <input class="full" type="password" id="sToken" value="${esc(cfg.token || "")}" autocomplete="off">
      <details style="margin-top:10px"><summary class="muted">Advanced</summary>
        <label class="f">Branch</label><input class="full" type="text" id="sBranch" value="${esc(cfg.branch)}">
        <label class="f">API URL</label><input class="full" type="text" id="sApi" value="${esc(cfg.api)}">
      </details>
      <div class="err" id="sErr"></div>
      <footer><button class="danger" id="sForget" title="Remove the token and cached tickets from this device">Sign out</button>
        <div class="spacer"></div><button class="primary" id="sSave">Save &amp; connect</button></footer>
    </div></div>`;
  const close = () => { $("#modalRoot").innerHTML = ""; };
  $("#closeBtn").onclick = close;
  $("#scrim").onclick = (e) => { if (e.target.id === "scrim") close(); };
  $("#sForget").onclick = () => {
    if (!confirm("Remove the token and cached tickets from this device?")) return;
    ["tickets.cfg", "tickets.cache", "tickets.sha"].forEach((k) => localStorage.removeItem(k));
    location.reload();
  };
  $("#sSave").onclick = async () => {
    Object.assign(cfg, { owner: $("#sOwner").value.trim(), repo: $("#sRepo").value.trim(), token: $("#sToken").value.trim(),
      branch: $("#sBranch").value.trim() || "main", api: $("#sApi").value.trim().replace(/\/$/, "") || "https://api.github.com" });
    $("#sErr").textContent = "Connecting…";
    try {
      const remote = await fetchRemote();
      saveCfg();
      state.data = remote.data; state.sha = remote.sha; state.error = null; cache();
      close(); render();
    } catch (e) { $("#sErr").textContent = e.message; }
  };
}

// ============ wiring ============
function setView(view) {
  state.view = view;
  if (view !== "devlog") { state.ticketView = view; localStorage.setItem("tickets.ticketView", view); }
  localStorage.setItem("tickets.view", view);
  render();
}
$("#nav").onclick = (e) => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  setView(b.dataset.view);
};
$("#section").onclick = (e) => {
  const b = e.target.closest("[data-section]"); if (!b) return;
  setView(b.dataset.section === "devlog" ? "devlog" : state.ticketView);
};
$("#epicFilter").onchange = (e) => { state.epic = e.target.value; localStorage.setItem("tickets.epic", state.epic); render(); };
$("#settingsBtn").onclick = openSettings;
document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-open]");
  if (o && !e.target.closest("[data-restore],[data-delete]")) { if (state.openId != null) commitText(); openTicket(+o.dataset.open); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && $("#modalRoot").innerHTML) { state.openId != null ? closeModal() : ($("#modalRoot").innerHTML = ""); return; }
  if (e.target.closest?.("input, textarea, select") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "n" && state.view === "board" && configured()) { e.preventDefault(); $("#addTitle")?.focus(); }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
addEventListener("online", () => { flush(); refresh(); });
addEventListener("beforeunload", (e) => { commitText(); if (state.pending.length) e.preventDefault(); });
setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);

render();
refresh();
</script>
</body>
</html>
